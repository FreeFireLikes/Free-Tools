<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verification Result</title>
<style>
body{background:#02050a;color:white;font-family:Segoe UI;text-align:center;padding-top:120px}
.card{background:#111827;padding:45px;margin:auto;width:380px;border-radius:18px}
button{margin-top:12px;padding:12px 20px;border:none;border-radius:8px;background:#ff6a00;color:white;cursor:pointer}
.fail{color:#ff4d4d}
.success{color:#4cff9a}
</style>
</head>
<body>

<div class="card">
<h2 id="title"></h2>
<p id="info"></p>

<button onclick="location='index.html'">Go to Main Page</button>
<button id="retry" style="display:none" onclick="retry()">Verify Again</button>
</div>

<script>
let uid=localStorage.getItem("ff_uid");
let region=localStorage.getItem("ff_region");

let success=Math.random()>0.35;

let orders=JSON.parse(localStorage.getItem("ff_orders")||"[]");
let now=new Date().toLocaleString();

if(success){
title.innerHTML="<span class='success'>Verification Complete ✅</span>";
info.innerText="UID: "+uid+" | Region: "+region;
orders.push({uid,region,status:"Successful",date:now});
}else{
title.innerHTML="<span class='fail'>Verification Not Completed Properly</span>";
info.innerText="Please verify again";
retry.style.display="inline-block";
orders.push({uid,region,status:"Failed",date:now});
}

localStorage.setItem("ff_orders",JSON.stringify(orders));

function retry(){
location="verify.html?uid="+uid+"&region="+region;
}
</script>

</body>
</html>
