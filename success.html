<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verification Complete</title>
<style>
body{
    background:radial-gradient(circle,#08111f,#02050a);
    color:white;
    font-family:Segoe UI;
    text-align:center;
    padding-top:120px;
}
.card{
    background:rgba(17,25,40,.75);
    backdrop-filter:blur(12px);
    padding:40px;
    margin:auto;
    width:380px;
    border-radius:18px;
}
</style>
</head>
<body>

<div class="card">
<h2>Verification Complete ✅</h2>
<p id="info"></p>
<p>Your request has been processed successfully. Likes received in your profile in 10-15 minutes because many players sending likes on their profile. If likes not receive or facing any problem visit our YouTube channel SATELLITE FF</p>
</div>

<script>
const p=new URLSearchParams(location.search);
info.innerText="UID: "+p.get("uid")+" | Region: "+p.get("region");
</script>

</body>
</html>
