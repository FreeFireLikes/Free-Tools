<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verification</title>
<style>
body{background:#02050a;color:white;font-family:Segoe UI;text-align:center;padding-top:120px}
.card{background:#111827;padding:40px;margin:auto;width:360px;border-radius:18px}
button{padding:15px 30px;background:#ff6a00;border:none;border-radius:10px;color:white;font-size:18px;cursor:pointer}
</style>
</head>
<body>

<div class="card">
<h2>Verification Required</h2>
<p>Complete verification to continue</p>
<button onclick="verify()">VERIFY</button>
</div>

<script>
const p=new URLSearchParams(location.search);
const uid=p.get("uid");
const region=p.get("region");

localStorage.setItem("ff_uid",uid);
localStorage.setItem("ff_region",region);

function verify(){
location.href="https://linkpays.in/9AkSgr";
}
</script>

</body>
</html>
