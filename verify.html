<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Required</title>

    padding-top:120px;

.card{
    background:rgba(17,25,40,.75);

    width:360px;
    border-radius:18px;

    border:none;
    border-radius:10px;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;

button:hover{
    transform:scale(1.05);

.small{

    font-size:14px;

<body>

<div class="card">

<script>
// Read UID + region from URL
const params=new URLSearchParams(location.search);
const uid=params.get("uid");
const region=params.get("region");

// Save locally before leaving page
localStorage.setItem("ff_uid", uid);
localStorage.setItem("ff_region", region);

function verify(){
    // 🔴 PUT YOUR LINKSPAY LINK HERE
