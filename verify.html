<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verification Required</title>
<style>
body{
    background:radial-gradient(circle,#08111f,#02050a);
    color:white;
    font-family:Segoe UI;
    text-align:center;
    padding-top:120px;
}
.card{
    background:rgba(17,25,40,.75);
    backdrop-filter:blur(12px);
    padding:40px;
    margin:auto;
    width:360px;
    border-radius:18px;
}
button{
    padding:15px 30px;
    background:#ff6a00;
    border:none;
    border-radius:10px;
    color:white;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="card">
<h2>Verification required</h2>
<p>Complete the step to continue</p>
<button onclick="verify()">VERIFY</button>
</div>

<script>
const params=new URLSearchParams(location.search);
const uid=params.get("uid");
const region=params.get("region");

function verify(){
    const shortlink="https://your-shortlink.com"; // replace
    location.href=shortlink+"?redirect="+encodeURIComponent(
        "success.html?uid="+uid+"&region="+region
    );
}
</script>

</body>
</html>
