<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Fan</title>

<style>
body{
margin:0;font-family:Segoe UI;background:radial-gradient(circle,#08111f,#02050a);color:white;
}
header{
padding:80px 20px;text-align:center;
background:url('https://wallpapercave.com/wp/wp8937134.jpg') center/cover;
}
header h1{
font-size:60px;color:#ff6a00;text-shadow:0 0 25px #ff6a00;
}

/* MENU */
.menu{position:absolute;top:20px;left:20px;cursor:pointer}
.menu div{width:30px;height:3px;background:white;margin:6px 0}

.drawer{
position:fixed;left:-260px;top:0;width:260px;height:100%;
background:#0b1220;padding:20px;transition:.4s;
}
.drawer a{display:block;color:white;padding:12px 0;text-decoration:none}
.drawer.open{left:0}

/* CARD */
.card{
background:rgba(17,25,40,.75);backdrop-filter:blur(12px);
max-width:420px;margin:-40px auto 40px;padding:30px;border-radius:20px;
}

#uidDisplay{background:black;padding:15px;border-radius:10px;margin-bottom:15px}

.keypad button{
width:70px;height:55px;margin:6px;border:none;border-radius:10px;
background:#111827;color:white;font-size:18px;cursor:pointer
}
.keypad button:hover{background:#ff6a00}

select{width:100%;padding:12px;border-radius:10px;border:none}

.send{
margin-top:20px;width:100%;padding:15px;border:none;border-radius:10px;
background:linear-gradient(90deg,#ff6a00,#ff9500);color:white;font-size:18px;
cursor:pointer
}

.loader{display:none;margin-top:15px}
.bar{height:6px;background:#ff6a00;width:0;border-radius:10px;animation:load 2s forwards}
@keyframes load{to{width:100%}}
</style>
</head>

<body>

<div class="menu" onclick="toggleMenu()">
<div></div><div></div><div></div>
</div>

<div class="drawer" id="drawer">
<h3>Menu</h3>
<a href="orders.html">Your Orders</a>
<a href="#" onclick="alert('Service coming soon')">Section 1</a>
<a href="#" onclick="alert('Service coming soon')">Section 2</a>
</div>

<header>
<h1>Free Fire Fan</h1>
</header>

<div class="card">
<div id="uidDisplay">Enter UID</div>

<div class="keypad">
<button onclick="add(1)">1</button>
<button onclick="add(2)">2</button>
<button onclick="add(3)">3</button><br>
<button onclick="add(4)">4</button>
<button onclick="add(5)">5</button>
<button onclick="add(6)">6</button><br>
<button onclick="add(7)">7</button>
<button onclick="add(8)">8</button>
<button onclick="add(9)">9</button><br>
<button onclick="clearUID()">C</button>
<button onclick="add(0)">0</button>
<button onclick="back()">⌫</button>
</div>

<select id="region">
<option>India</option>
<option>Nepal</option>
<option>Bangladesh</option>
<option>Pakistan</option>
<option>Singapore</option>
</select>

<button class="send" onclick="send()">Send</button>

<div class="loader" id="loader">
<div class="bar"></div>
<p>Processing...</p>
</div>
</div>

<script>
let uid="";
function add(n){uid+=n;uidDisplay.innerText=uid}
function clearUID(){uid="";uidDisplay.innerText="Enter UID"}
function back(){uid=uid.slice(0,-1);uidDisplay.innerText=uid||"Enter UID"}

function toggleMenu(){
document.getElementById("drawer").classList.toggle("open");
}

function send(){
if(uid.length<5){alert("Enter valid UID");return;}
loader.style.display="block";
setTimeout(()=>{
location="verify.html?uid="+uid+"&region="+region.value;
},2000);
}
</script>

</body>
    </html>
