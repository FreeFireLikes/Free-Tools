<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Free Likes</title>

<style>
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    color:white;
    background:radial-gradient(circle at top,#08111f,#02050a);
    overflow-x:hidden;
}

/* PARTICLE BACKGROUND EFFECT */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background:url("https://www.transparenttextures.com/patterns/stardust.png");
    opacity:.15;
    animation:move 80s linear infinite;
    z-index:-1;
}
@keyframes move{
    from{transform:translate(0,0)}
    to{transform:translate(-50%,-50%)}
}

/* HEADER */
header{
    padding:80px 20px;
    text-align:center;
    background:url('https://wallpapercave.com/wp/wp8937134.jpg') center/cover no-repeat;
}

header h1{
    font-size:64px;
    color:#ff6a00;
    text-shadow:0 0 30px #ff6a00,0 0 80px rgba(255,106,0,.6);
}

/* HAMBURGER */
.menu{
    position:absolute;
    top:20px;
    left:20px;
    cursor:pointer;
}
.menu div{
    width:30px;height:3px;background:white;margin:6px 0;
}

/* GLASS CARD */
.card{
    backdrop-filter:blur(14px);
    background:rgba(17,25,40,.65);
    border:1px solid rgba(255,255,255,.1);
    max-width:420px;
    margin:-40px auto 40px;
    padding:30px;
    border-radius:22px;
    box-shadow:0 0 40px rgba(0,255,255,.08);
}

/* UID DISPLAY */
#uidDisplay{
    background:#000;
    padding:16px;
    font-size:22px;
    border-radius:10px;
    margin-bottom:15px;
    letter-spacing:2px;
}

/* KEYPAD */
.keypad button{
    width:70px;height:58px;
    margin:6px;
    border:none;
    border-radius:12px;
    font-size:18px;
    background:#111827;
    color:white;
    cursor:pointer;
    transition:.2s;
}
.keypad button:hover{
    background:#ff6a00;
    transform:translateY(-2px);
}

/* SELECT */
select{
    padding:13px;
    width:100%;
    margin-top:15px;
    border-radius:10px;
    border:none;
}

/* BUTTON */
.send{
    margin-top:20px;
    padding:15px;
    width:100%;
    background:linear-gradient(90deg,#ff6a00,#ff9500);
    border:none;
    border-radius:12px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* LOADER */
.loader{
    display:none;
    margin-top:15px;
}
.bar{
    height:6px;
    width:0;
    background:#ff6a00;
    border-radius:10px;
    animation:load 2s forwards;
}
@keyframes load{
    to{width:100%}
}

/* POPUP */
.popup{
    position:fixed;inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    justify-content:center;
    align-items:center;
}
.popup-box{
    background:#111827;
    padding:30px;
    border-radius:18px;
}
</style>
</head>

<body>

<div class="menu" onclick="showService()">
<div></div><div></div><div></div>
</div>

<header>
<h1>Free Fire Likes Sender</h1>
</header>

<div class="card">

<div id="uidDisplay">Enter UID</div>

<div class="keypad">
<button onclick="addNum(1)">1</button>
<button onclick="addNum(2)">2</button>
<button onclick="addNum(3)">3</button><br>
<button onclick="addNum(4)">4</button>
<button onclick="addNum(5)">5</button>
<button onclick="addNum(6)">6</button><br>
<button onclick="addNum(7)">7</button>
<button onclick="addNum(8)">8</button>
<button onclick="addNum(9)">9</button><br>
<button onclick="clearUID()">C</button>
<button onclick="addNum(0)">0</button>
<button onclick="back()">⌫</button>
</div>

<select id="region">
<option>India</option>
<option>Nepal</option>
<option>Bangladesh</option>
<option>Pakistan</option>
<option>Singapore</option>
<option>Middle East</option>
</select>

<button class="send" onclick="send()">Send</button>

<div class="loader" id="loader">
<div class="bar"></div>
<p>Checking UID...</p>
</div>

</div>

<div class="popup" id="popup">
<div class="popup-box">
<h3>This service coming soon</h3>
<button onclick="closePopup()">OK</button>
</div>
</div>

<script>
let uid="";

function addNum(n){
    uid+=n;
    document.getElementById("uidDisplay").innerText=uid;
}
function clearUID(){uid="";uidDisplay.innerText="Enter UID";}
function back(){uid=uid.slice(0,-1);uidDisplay.innerText=uid||"Enter UID";}
function showService(){popup.style.display="flex";}
function closePopup(){popup.style.display="none";}

function send(){
    if(uid.length<5){alert("Enter valid UID");return;}
    document.getElementById("loader").style.display="block";
    setTimeout(()=>{
        let region=document.getElementById("region").value;
        window.location="verify.html?uid="+uid+"&region="+region;
    },2000);
}
</script>

</body>
  </html>
