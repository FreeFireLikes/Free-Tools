<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Fan</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Segoe UI, sans-serif;
background:radial-gradient(circle,#08111f,#02050a);
color:white;
}

/* HEADER */
header{
padding:60px 20px 120px;
text-align:center;
background:url('https://wallpapercave.com/wp/wp8937134.jpg') center/cover no-repeat;
}

header h1{
font-size:clamp(32px,8vw,56px);
color:#ff6a00;
text-shadow:0 0 25px #ff6a00;
margin:0;
}

/* MENU */
.menu{
position:fixed;
top:18px;
left:18px;
z-index:1001;
cursor:pointer;
}
.menu div{
width:26px;height:3px;background:white;margin:6px 0;
}

/* DRAWER */
.drawer{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#0b1220;
padding:25px;
transition:.3s;
z-index:1000;
box-shadow:5px 0 20px rgba(0,0,0,.4);
}
.drawer.open{left:0}
.drawer a{
display:block;
color:white;
padding:12px 0;
text-decoration:none;
border-bottom:1px solid rgba(255,255,255,.1);
}

/* CARD */
.card{
background:rgba(17,25,40,.78);
backdrop-filter:blur(12px);
max-width:420px;
margin:-90px auto 40px;
padding:24px;
border-radius:18px;
text-align:center;
width:92%;
}

/* UID */
#uidDisplay{
background:black;
padding:14px;
border-radius:10px;
margin-bottom:16px;
letter-spacing:2px;
font-size:20px;
}

/* KEYPAD */
.keypad{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:14px;
}
.keypad button{
padding:16px 0;
border:none;
border-radius:12px;
background:#111827;
color:white;
font-size:18px;
cursor:pointer;
}
.keypad button:hover{background:#ff6a00}

/* SELECT */
select{
width:100%;
padding:14px;
border-radius:12px;
border:none;
margin-top:6px;
font-size:16px;
}

/* SEND */
.send{
margin-top:16px;
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff6a00,#ff9500);
color:white;
font-size:18px;
cursor:pointer;
}

/* LOADER */
.loader{display:none;margin-top:12px}
.bar{
height:6px;background:#ff6a00;width:0;border-radius:10px;
animation:load 1.8s forwards;
}
@keyframes load{to{width:100%}}

/* MOBILE FIX */
@media(max-width:420px){
header{padding:60px 15px 110px}
.card{margin:-80px auto 30px}
}
</style>
</head>

<body>

<div class="menu" onclick="toggleMenu()">
<div></div><div></div><div></div>
</div>

<div class="drawer" id="drawer">
<h3>Menu</h3>
<a href="orders.html">Your Orders</a>
<a href="#" onclick="alert('Service coming soon')">Guild Glory Bot</a>
<a href="#" onclick="alert('Service coming soon')">Rank Pusher Bots</a>
</div>

<header>
<h1>Free Fire Free Likes</h1>
</header>

<div class="card">

<div id="uidDisplay">Enter UID</div>

<div class="keypad">
<button onclick="add(1)">1</button>
<button onclick="add(2)">2</button>
<button onclick="add(3)">3</button>
<button onclick="add(4)">4</button>
<button onclick="add(5)">5</button>
<button onclick="add(6)">6</button>
<button onclick="add(7)">7</button>
<button onclick="add(8)">8</button>
<button onclick="add(9)">9</button>
<button onclick="clearUID()">C</button>
<button onclick="add(0)">0</button>
<button onclick="back()">⌫</button>
</div>

<select id="region">
<option>India</option>
<option>Nepal</option>
<option>Bangladesh</option>
<option>Pakistan</option>
<option>Singapore</option>
</select>

<button class="send" onclick="send()">Send</button>

<div class="loader" id="loader">
<div class="bar"></div>
<p>Processing...</p>
</div>

</div>

<script>
let uid="";

function add(n){uid+=n;uidDisplay.innerText=uid}
function clearUID(){uid="";uidDisplay.innerText="Enter UID"}
function back(){uid=uid.slice(0,-1);uidDisplay.innerText=uid||"Enter UID"}

function toggleMenu(){
drawer.classList.toggle("open");
}

function send(){
if(uid.length<5){alert("Enter valid UID");return;}
loader.style.display="block";
setTimeout(()=>{
location="verify.html?uid="+uid+"&region="+region.value;
},1500);
}
</script>

</body>
</html>
